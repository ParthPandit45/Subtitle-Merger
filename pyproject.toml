[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-subs"
version = "1.0.0"
description = "Losslessly embed matching subtitles into TV episodes and video files in place using FFmpeg."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Parth Pandit", email = "pp03232422@student.ku.edu.np" }
]
urls = { "Homepage" = "https://github.com/ParthPandit45/Subtitle-Merger", "Repository" = "https://github.com/ParthPandit45/Subtitle-Merger", "Issues" = "https://github.com/ParthPandit45/Subtitle-Merger/issues" }
keywords = ["subtitles", "ffmpeg", "mkv", "mp4", "video", "remux", "batch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[project.scripts]
merge-subs = "merge_subs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["merge_subs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
